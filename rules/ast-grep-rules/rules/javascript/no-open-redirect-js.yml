# Turntable policy override — shadows the built-in no-open-redirect-js
# (same id).
#
# Navigation targets in this app are paths built by mediaUrl() on this app's
# own API origin from API data (e.g. track downloads). No user-supplied
# external URLs reach location.href.
#
# A never-matching condition keeps the rule registered and documented while
# silencing the false positive. Delete this file to restore the built-in rule.
id: no-open-redirect-js
language: JavaScript
severity: info
message: >-
  open-redirect check disabled: navigation targets are own-origin API paths
rule:
  all:
    - kind: identifier
    - regex: "^$"
