[project]
name = "telegram-music-player"
version = "0.1.0"
description = "A private web player for music stored in Telegram"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "segno>=1.6,<2",
  "telethon>=1.40,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = []
