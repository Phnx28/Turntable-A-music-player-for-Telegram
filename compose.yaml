services:
  player:
    build: .
    env_file: .env
    # To keep the player private on a multi-user or public network, bind to localhost only:
    #   ports:
    #     - "127.0.0.1:8000:8000"
    # and have a reverse proxy (Caddy/nginx/Traefik) handle TLS. See README Security.
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
