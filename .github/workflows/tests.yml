name: tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        # The project is a virtual uv project ([tool.uv] package = false): loose
        # modules at the repo root, deliberately not installable. Tests import
        # them from the checkout, so only the runtime dependencies are needed.
        run: pip install cryptography fastapi "httpx[socks]" segno telethon "uvicorn[standard]"
      - name: Run tests
        run: python -m unittest discover -s tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install icon build deps
        run: npm ci
      - name: Syntax check
        run: node --check static/app.js && node --check static/player-core.js && node --check static/format.js
      - name: Unit tests
        run: node --test static/*.test.js
      - name: Icon sprite audit
        run: python3 tools/build_icons.py --check

  layout:
    name: Layout tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        # Virtual uv project — see the Python tests job. Layout tests additionally
        # drive Playwright against a live server instance.
        run: pip install cryptography fastapi "httpx[socks]" segno telethon "uvicorn[standard]" playwright
      - name: Install Chromium
        run: python -m playwright install chromium --with-deps
      - name: Run layout tests
        run: python -m unittest tests.test_layout -q
